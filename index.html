<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./node_modules/font-awesome/css/font-awesome.css">
    <link rel="stylesheet" href="./styles.css">

    <title>Tic-Tac-Toe</title>
</head>
<body>
    
    <h2>Welcome to Tic-Tac-Toe!</h2>
    <div class="board">
        <div class="board-box">
            <div class="board-cell" data-id="0">
            </div>
        </div>
        <div class="board-box">
            <div class="board-cell" data-id="1">
            </div>
        </div>
        <div class="board-box">
            <div class="board-cell" data-id="2">
            </div>
        </div>
        <div class="board-box">
            <div class="board-cell" data-id="3">
            </div>
        </div>
        <div class="board-box">
            <div class="board-cell" data-id="4">
            </div>
        </div>
        <div class="board-box">
            <div class="board-cell" data-id="5">
            </div>
        </div>
        <div class="board-box">
            <div class="board-cell" data-id="6">
            </div>
        </div>
        <div class="board-box">
            <div class="board-cell" data-id="7">         
            </div>
        </div>
        <div class="board-box">
            <div class="board-cell" data-id="8">
            </div>
        </div>
    </div>

    <p id="player-text">Player X's turn</p>

    <script src="./node_modules/jquery/dist/jquery.slim.min.js"></script>
    <script src="./node_modules/popper.js/dist/popper.min.js"></script>
    <script src="./node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="./scripts.js"></script>

</body>
</html>
